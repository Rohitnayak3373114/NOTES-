
    
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HOME SCREEN -->
    <section id="home">
        <header>My Notes</header>

        <div class="container">
            <p class="subtitle">Choose your workspace</p>

            <div class="spaces" id="spaces"></div>

            <div class="create-space" onclick="createSpace()">
                + Create Custom Space
            </div>
        </div>
    </section>

    <!-- SPACE SCREEN -->
    <section id="spaceScreen" class="hidden">

        <div class="topbar">
            <span class="back" onclick="goHome()">←</span>
            <h2 id="spaceTitle">Normal Space</h2>
        </div>

        <div class="notes-container" id="notesContainer"></div>

        <button class="add-btn" onclick="newNote()">+</button>
    </section>

    <!-- NOTE EDITOR -->
    <section id="editorScreen" class="hidden">

        <div class="topbar">
            <span class="back" onclick="closeEditor()">←</span>
            <h2>Write Note</h2>
        </div>

        <div class="editor">
            <input id="noteTitle" placeholder="Enter title...">

            <textarea id="noteContent"
                placeholder="Start writing your script here..."></textarea>
        </div>

        <div class="editor-actions">
            <button class="save" onclick="saveNote()">Save Note</button>
            <button class="delete" onclick="deleteNote()">Delete</button>
        </div>

    </section>

    <script src="script.js"></script>
</body>
</html>
